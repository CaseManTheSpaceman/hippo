/* =========================
   FONTS
   ========================= */
@font-face{font-family:'Petrona';font-style:normal;font-weight:300;font-display:swap;src:url('./fonts/Petrona-300.woff2') format('woff2');}
@font-face{font-family:'Petrona';font-style:normal;font-weight:400;font-display:swap;src:url('./fonts/Petrona-400.woff2') format('woff2');}
@font-face{font-family:'Petrona';font-style:normal;font-weight:600;font-display:swap;src:url('./fonts/Petrona-600.woff2') format('woff2');}
@font-face{font-family:'Quicksand';font-style:normal;font-weight:500;font-display:swap;src:url('./fonts/Quicksand-500.woff2') format('woff2');}
/* Georgia stand-in with Petrona's metrics, so the headline does not reflow when the real font loads */
@font-face{font-family:'Petrona Fallback';src:local('Georgia'),local('Times New Roman');size-adjust:92%;ascent-override:96%;descent-override:24%;line-gap-override:0%;}


/* =========================
   DESIGN CONTROLS
   Everything you are likely to want to tune lives here.
   Values are the ones the page shipped with, so changing
   nothing leaves the design exactly as it was.
   ========================= */
:root{
  /* ---- Brand colours (from the hippO design system) ---- */
  --cream:#FEFCF6;              /* page background */
  --ink:#102845;                /* headline + body text */
  --white:#FFFFFF;              /* input background */
  --hippo-purple:#B9BCEF;       /* the hippo, and the Notify button */
  --medium-purple:#8080E8;      /* button hover, input focus ring */
  --dark-purple:#6969C9;        /* button press, thank-you message */
  --web-grey:#67737F;           /* footer text */
  --border-colour:#DCDDF7;      /* input outline */

  /* ---- Typefaces ---- */
  --serif:'Petrona','Petrona Fallback',Georgia,serif;   /* headline, form */
  --round:'Quicksand',sans-serif;                        /* footer only */

  /* ---- PAGE PADDING ---- */
  --page-padding-x:clamp(1.25rem, 7vw, 7rem);
  /* Left/right margin for logo, headline, hippo and footer. Raise to pull everything inward. */
  --page-padding-top:clamp(1rem, 3vmin, 2.5rem);
  /* Space above the logo. */
  --page-padding-bottom:max(1.25rem, env(safe-area-inset-bottom));
  /* Space below the footer. The env() part keeps clear of the iPhone home bar. */

  /* ---- LOGO ---- */
  --logo-width:clamp(45px, 14vw, 220px);
  /* Overall width of the logo lockup. The 45px floor is the minimum legible size. */

  /* ---- VERTICAL RHYTHM ---- */
  --gap-logo-to-headline:clamp(.75rem, 3vmin, 2.5rem);
  /* Space between the logo and "Healthy skin starts here." */
  --gap-headline-to-hippo:clamp(.75rem, 3vmin, 3rem);
  /* Space between the headline and the hippo area. */
  --gap-hippo-to-footer:1rem;
  /* Space between the hippo area and the copyright line. */

  /* ---- HEADLINE ---- */
  --headline-size:clamp(2rem, min(9vw, 10svh), 7.25rem);
  /* Grows with the window but never past 7.25rem. The 10svh term keeps it from
     swallowing short screens. */
  --headline-line-height:.95;   /* tighter than 1 = lines sit closer together */
  --headline-letter-spacing:-.045em;  /* negative = letters pull together */
  --headline-weight:300;        /* Petrona Light */

  /* ---- HIPPO ---- */
  --hippo-width:min(100%, max(60%, 280px));
  /* Width of the hippo inside the stage. Raise the 60% to make it bigger. */
  --hippo-height:60%;
  /* Share of the stage height the hippo fills. Raise to make it taller. */
  --hippo-slide:.31;
  /* How far down the hippo slides (as a share of its own height) to clear room
     for the email form. The page enlarges this automatically if the form needs
     more room, so treat it as a minimum. */
  --hippo-bleed-left:0px;
  --hippo-bleed-right:0px;
  /* How far the hippo extends past the page's side margin on each side, toward
     the screen edge. 0 keeps that side aligned with the headline; setting it to
     --page-padding-x runs the artwork to the edge. Larger values crop it. */
  --hippo-align:flex-start;
  /* flex-start = hippo hugs the left margin. center = centred in the stage. */

  /* ---- EMAIL FORM ---- */
  --form-width:min(88%, 34rem);   /* overall width of the input + button row */
  --form-row-gap:.85rem;          /* vertical gap when the button wraps below */
  --form-column-gap:.65rem;       /* gap between input and button */
  --input-height:3.25rem;
  --input-padding-x:1.5rem;
  --input-font-size:16px;         /* keep at 16px — anything smaller makes iOS zoom on focus */
  --button-height:3.25rem;
  --button-padding-x:1.75rem;
  --button-font-size:16px;
  --form-nudge-up:14px;
  /* Lifts the form slightly within the space above the hippo. Raise to move it up. */

  /* ---- FOOTER ---- */
  --footer-size:12px;

  /* ---- ANIMATION TIMINGS (ms) ----
     The JavaScript reads these, so the whole sequence is tuned from here.
     The clock starts when the page loads. */
  --t-field-clears:1100;      /* hippo field begins fading away */
  --t-wordmark:2200;          /* logo wordmark fades in */
  --t-sequence-start:2750;    /* headline + footer fade in — beat 1 */
  --t-headline-to-hippo:1700; /* wait from headline until the hippo reveals */
  --t-hippo-to-blink:2700;    /* wait from headline until the hippo blinks */
  --t-hippo-to-swap:3700;     /* wait from headline until "Coming Soon" appears */
  --t-swap-to-form:5400;      /* wait from headline until the email form appears */
  --t-idle-reset:5000;        /* idle time before the sequence replays */
  --t-loop-restart:900;       /* pause after a rewind before beat 1 plays again */

  /* ---- ANIMATION DURATIONS ---- */
  --dur-hippo-reveal:2s;      /* how long the hippo takes to fade in */
  --dur-hippo-slide:1s;       /* how long the hippo takes to slide down */
  --dur-form:1s;              /* how long the email form takes to arrive */
  --dur-headline-in:.9s;      /* headline fade in */
  --dur-headline-out:.55s;    /* headline fade out during the swap */
  --dur-blink:.5s;
  --dur-tile-fade:.7s;        /* each hippo tile's fade */
  --tile-stagger:.55;         /* how much later the far tiles clear than the near ones */

  /* ---- EASING ---- */
  --ease-soft:cubic-bezier(.4,0,.2,1);        /* hovers and small state changes */
  --ease-slide:cubic-bezier(.2,.75,.25,1);    /* the hippo's slide */

  /* ---- OPENING FIELD ---- */
  --purple-hippo-count:7;
  /* How many of the opening field's hippos are brand purple instead of pale.
     Must be an odd number — an even value drops to the next lower odd one, and
     the count shrinks if the grid has fewer rows or columns than that. The
     centre logo hippo is not counted. Mobile overrides this below. */

  /* ---- SHAPE ---- */
  --pill:999px;
  --border:1.5px solid var(--border-colour);
  --shadow-soft:0 2px 10px rgba(16,40,69,.08);
}

/* ---- MOBILE OVERRIDES ----
   Only the variables that actually differ. Everything else is inherited,
   so there is one place to change each value. Breakpoint: 600px. */
@media (max-width:600px){
  :root{
    --page-padding-x:1.25rem;
    /* Side margin on phones. Lower for a wider composition. */
    --gap-logo-to-headline:2rem;  
    /* space above H1 */
    --gap-headline-to-hippo:2rem;   
    /* space below H1 */
    --mobile-hippo-width:100%;
    --hippo-width:var(--mobile-hippo-width);
    /* Increase this to make the hippo larger on mobile. */
    --hippo-height:82%;
    /* Share of the stage the hippo fills on mobile. */
    --hippo-slide:.42;
    /* Mobile needs a bigger slide because the hippo is taller. */
    --form-width:min(82%, 17.5rem);
    --form-row-gap:.5rem;
    --input-height:2.75rem;      /* 44px — the minimum comfortable tap target */
    --input-padding-x:.95rem;
    --button-height:2.75rem;
    --button-padding-x:1rem;
    --button-font-size:14px;
    --form-nudge-up:8px;
    --hippo-bleed-left:1.25rem;
    --hippo-bleed-right:0px;
    /* On mobile the hippo runs off the left edge while its nose keeps the page
       margin on the right. */
    --mobile-input-text-align:center;
    /* When the button wraps below the field, the placeholder and typed text are
       centred to match the button. Set to "left" to return to a normal field. */
    --purple-hippo-count:5;
    /* Fewer accents on a phone, where the grid is only a few columns wide. */
    --headline-size:clamp(2rem, min(9vw, 10svh), 3.25rem);

    /* Mobile-only opening timing */
    --t-field-clears:1800;
    --t-wordmark:2900;
    --t-sequence-start:3450;
    --dur-tile-fade:.9s;
  }
   /* Move only “Healthy skin starts here” down */
   #l1{
    transform:translateY(20px);
  }
}

/* ---- SHORT SCREENS ----
   Height-based, so it catches any phone in landscape or a small laptop
   rather than targeting specific devices. */
@media (max-height:640px){
  :root{
    --page-padding-top:.75rem;
    --gap-logo-to-headline:.5rem;
    --gap-headline-to-hippo:.5rem;
    --gap-hippo-to-footer:.5rem;
    --headline-size:clamp(1.75rem, min(8vw, 12svh), 3rem);
    --logo-width:clamp(45px, 11vw, 150px);
  }
}


/* =========================
   BASE / RESET
   ========================= */
*,*::before,*::after{box-sizing:border-box;}
html,body{
  margin:0;
  overflow:hidden;
  background:var(--cream);
  color:var(--ink);
  font-family:var(--serif);
  -webkit-text-size-adjust:100%;   /* stop iOS inflating text in landscape */
}
a{color:var(--dark-purple);}
a:hover{color:var(--medium-purple);}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}


/* =========================
   PAGE LAYOUT
   One column: logo, headline, stage, footer.
   The stage is the only flexible row — it absorbs whatever height is left,
   so nothing is ever pushed off the bottom.
   ========================= */
.page{
  width:100%;
  height:100svh;          /* svh = the small viewport height, so mobile browser
                             chrome appearing cannot cut the page off */
  min-height:100svh;
  display:flex;
  flex-direction:column;
  padding:var(--page-padding-top) var(--page-padding-x) var(--page-padding-bottom);
  gap:0;
}
@supports (height:100dvh){
  .page{height:100dvh;min-height:100dvh;}   /* follows the chrome as it hides */
}


/* =========================
   LOGO
   ========================= */
.masthead{
  flex:0 0 auto;
  display:flex;
  justify-content:center;
  align-items:center;
}
.masthead svg{display:block;width:var(--logo-width);height:auto;overflow:visible;}
#word{opacity:0;transition:opacity 1.2s ease;}
.page.p2 #word,.page.p3 #word,.page.p4 #word,.page.p5 #word{opacity:1;}


/* =========================
   TYPOGRAPHY
   Both headlines share one grid cell so swapping them shifts nothing.
   ========================= */
h1{
  margin:var(--gap-logo-to-headline) 0 var(--gap-headline-to-hippo);
  flex:0 0 auto;
  display:grid;
  font-family:var(--serif);
  font-size:var(--headline-size);
  font-weight:var(--headline-weight);
  line-height:var(--headline-line-height);
  letter-spacing:var(--headline-letter-spacing);
  white-space:pre-line;
  opacity:0;
  transition:opacity var(--dur-headline-in) ease .1s;
}
.page.chrome h1{opacity:1;}
h1 span{grid-area:1/1;}
#l1{opacity:0;transition:opacity var(--dur-headline-in) ease .6s;}
#l2{align-self:center;opacity:0;transition:opacity .5s ease;}
.page.p3 #l1,.page.p4 #l1{opacity:1;}
.page.p5 #l1{opacity:0;transition:opacity var(--dur-headline-out) ease;}
.page.p5 #l2{opacity:1;transition:opacity var(--dur-headline-in) ease .35s;}
/* after a successful signup the headline returns to "Healthy skin starts here." */
.page.sent #l1{opacity:1;transition:opacity var(--dur-headline-in) ease .6s;}
.page.sent #l2{opacity:0;transition:opacity .5s ease;}


/* =========================
   HIPPO
   The stage is a normal flex row. Absolute positioning is used only for the
   form and thank-you, which have to sit OVER the hippo for the reveal.
   ========================= */
.stage{
  position:relative;
  flex:1 1 auto;
  min-height:0;               /* lets the stage shrink instead of overflowing */
  margin:0 calc(-1 * var(--hippo-bleed-right)) var(--gap-hippo-to-footer) calc(-1 * var(--hippo-bleed-left));
  width:auto;
  align-self:stretch;
  display:flex;
  align-items:center;
  justify-content:var(--hippo-align);
  overflow:hidden;            /* the hippo is cropped, never spilled sideways */
  opacity:0;
  transition:opacity var(--dur-hippo-reveal) ease;
}
.page.hippo-shown .stage{opacity:1;}
.trigger{
  appearance:none;
  width:100%;height:100%;
  margin:0;padding:0;border:0;
  background:transparent;
  cursor:pointer;
  transition:opacity .35s ease;
}
.page.open .trigger{opacity:.12;}
#hippo{
  display:block;
  width:var(--hippo-width);
  height:var(--hippo-height);
  max-width:100%;             /* can never overflow horizontally */
  will-change:opacity,transform;
  transform-origin:center bottom;
  transition:transform var(--dur-hippo-slide) var(--ease-slide);
}
#hippo svg{display:block;width:100%;height:100%;overflow:visible;}


/* =========================
   FORM
   ========================= */
.notify{
  position:absolute;
  z-index:2;
  top:19.3%;                  /* JS refines this once it can measure the stage */
  left:50%;
  width:var(--form-width);
  display:flex;
  flex-wrap:wrap;
  row-gap:var(--form-row-gap);
  column-gap:var(--form-column-gap);
  opacity:0;
  transform:translate(-50%, calc(-50% + 18px));
  transition:opacity var(--dur-form) ease .08s, transform var(--dur-form) ease .08s;
  pointer-events:none;
}
.page.open .notify{opacity:1;transform:translate(-50%,-50%);pointer-events:auto;}
.field{flex:1 1 14rem;min-width:0;display:flex;flex-direction:column;}
.notify input{
  width:100%;min-width:0;
  height:var(--input-height);
  padding:0 var(--input-padding-x);
  border:var(--border);
  border-radius:var(--pill);
  background:var(--white);
  color:var(--ink);
  font-family:var(--serif);
  font-size:var(--input-font-size);
  outline:none;
  transition:border-color .16s var(--ease-soft);
}
.notify input:focus{border-color:var(--medium-purple);}
.notify button{
  flex:1 1 8rem;
  align-self:flex-end;
  height:var(--button-height);
  padding:0 var(--button-padding-x);
  border:none;
  border-radius:var(--pill);
  background:var(--hippo-purple);
  color:var(--ink);
  font-family:var(--serif);
  font-weight:600;
  font-size:var(--button-font-size);
  cursor:pointer;
  box-shadow:var(--shadow-soft);
  transition:background .16s var(--ease-soft);
}
.notify button:hover{background:var(--medium-purple);}
.notify button:active{background:var(--dark-purple);}
.notify input.honeypot{width:1px;height:1px;padding:0;border:0;}   /* bot trap, never seen */

.thanks{
  position:absolute;
  z-index:2;
  left:50%;
  margin:0;
  width:var(--form-width);
  text-align:center;
  font-family:var(--serif);
  font-size:1.05rem;
  color:var(--dark-purple);
  opacity:0;
  transform:translate(-50%, calc(-50% + 10px));
  transition:opacity .7s ease .2s, transform .7s ease .2s;
  pointer-events:none;
}
.page.sent .thanks{opacity:1;transform:translate(-50%,-50%);}
.page.sent .notify{opacity:0;pointer-events:none;}

@media (max-width:600px){
  /* the button drops to its own full-width row rather than squeezing beside the input */
  .field{flex:1 1 100%;}
  .notify button{flex:1 1 100%;align-self:stretch;}
  .notify input{text-align:var(--mobile-input-text-align);}
}


/* =========================
   FOOTER
   ========================= */
footer{
  flex:0 0 auto;
  font-family:var(--round);
  font-weight:500;
  font-size:var(--footer-size);
  letter-spacing:.02em;
  color:var(--web-grey);
  text-align:center;
  opacity:0;
  transition:opacity var(--dur-headline-in) ease .1s;
}
.page.chrome footer{opacity:1;}


/* =========================
   ANIMATION
   ========================= */
@keyframes eye-close{0%,100%{transform:scaleY(1);}45%,60%{transform:scaleY(.08);}}
.eye{transform-origin:1448px 235px;}
.eye.blink{animation:eye-close var(--dur-blink) ease-in-out;}

    <path d="M1996.518,266.089c-13.195-83.954-76.191-184.038-301.4-184.038-64.78,0-144.293,4.641-221.178,9.132-50.709,2.963-99.302,5.796-139.666,7.026,7.888-10.493,12.967-23.81,14.155-37.014,2.791-31.097-15.162-54.767-45.751-60.312-19.919-3.597-38.38,3.895-50.839,20.529-14.505,19.355-17.538,47.051-7.381,67.366,1.528,3.057,3.7,5.517,5.712,8.117-76.284-5.358-191.577-21.014-312.326-37.415C746.165,33.434,528.915,3.922,390.227,3.922,120.661,3.922,0,165.072,0,324.779c0,132.179,65.521,223.615,118.172,297.085,29.01,40.481,54.073,75.455,61.271,107.884,1.389,6.234,5.615,25.226,30.799,25.226h157.936c9.775,0,18.13-4.054,22.901-11.127,3.895-5.768,7.124-16.178.377-32.942-4.687-11.621-3.937-21.732,2.264-30.92,14.687-21.75,74.108-58.234,307.079-58.234,259.553,0,311.646,21.881,336.369,87.625,8.909,23.679,22.235,45.597,59.072,45.597h123.465c11.956,0,23.143-5.871,29.937-15.702,6.775-9.803,8.308-22.309,4.096-33.436-32.686-86.572-36.381-174.486-9.412-223.979,12.804-23.511,32.178-38.217,57.577-43.687,45.849-9.869,95.318,3.047,157.931,19.393,66.975,17.482,150.327,39.26,258.505,39.26,117.963,0,200.071-26.083,244.042-77.505,32.63-38.151,44.111-89.703,34.135-153.23ZM1267.275,32.978c4.058-5.414,12.441-13.68,25.753-13.68,1.966,0,4.03.177,6.206.578,29.778,5.386,30.883,29.485,29.969,39.596-1.705,18.992-14.579,39.307-31.041,39.372h-.168c-17.622-.028-30.165-6.486-36.278-18.703-6.915-13.801-4.571-33.641,5.559-47.163ZM1947.719,406.776c-40.141,46.948-117.32,70.749-229.379,70.749-105.704,0-187.724-21.415-253.631-38.636-65.083-16.998-116.49-30.435-166.868-19.57-31.139,6.7-54.841,24.639-70.46,53.304-35.85,65.8-19.211,167.134,8.308,240.035,2.004,5.284,1.3,10.987-1.915,15.646-3.243,4.687-8.364,7.371-14.067,7.371h-123.465c-21.624,0-31.591-8.042-41.012-33.101-28.711-76.34-81.344-100.122-354.429-100.122-184.476,0-293.166,22.449-323.066,66.723-9.794,14.509-11.234,31.423-4.18,48.943,2.721,6.747,3.29,12.329,1.533,14.929-1.649,2.442-5.708,2.628-6.91,2.628h-157.936c-8.247,0-10.297-2.647-11.961-10.12-8.056-36.269-       </span>
    </button>

    <form class="notify" id="notify" action="#" method="post">
      <label class="sr" for="notify-email">Email address</label>
      <input class="sr honeypot" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div class="field">
        <input id="notify-email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
      </div>
      <button type="submit" id="submit">Notify me</button>
    </form>

    <p class="thanks" id="thanks" role="status">We'll be in touch.</p>
  </div>

</div>
<script>
(function(){
  /* =========================
     ENDPOINT
     Paste your endpoint here. Works with either:
       Google Sheet — the /exec URL from Apps Script (see google-apps-script.gs)
       Formspree    — https://formspree.io/f/YOUR_FORM_ID
     ========================= */
  var FORM_ENDPOINT='https://script.google.com/macros/s/AKfycbwb5MpAacIiTcNw6Q0g-ch5ti4fkZvd-pAwSzKofnZgG6qVP__Jcq3MZx3XWw-zjiFu/exec';

  /* =========================
     READ THE DESIGN CONTROLS
     Every number below comes from the CSS variables at the top of this file,
     so timings and geometry are tuned in one place.
     ========================= */
  /* one seed per page load — reused for every rebuild of the field */
  var PURPLE_SEED=(Date.now()^Math.floor(Math.random()*0x7FFFFFFF))|0;

  var root=document.documentElement;
  function cssVar(name){ return getComputedStyle(root).getPropertyValue(name).trim(); }
  function cssNum(name){ return parseFloat(cssVar(name)) || 0; }

  var T={};
  function readControls(){
    T={
      fieldClears:   cssNum('--t-field-clears'),
      wordmark:      cssNum('--t-wordmark'),
      sequenceStart: cssNum('--t-sequence-start'),
      toHippo:       cssNum('--t-headline-to-hippo'),
      toBlink:       cssNum('--t-hippo-to-blink'),
      toSwap:        cssNum('--t-hippo-to-swap'),
      toForm:        cssNum('--t-swap-to-form'),
      idleReset:     cssNum('--t-idle-reset'),
      loopRestart:   cssNum('--t-loop-restart'),
      hippoHeight:   cssNum('--hippo-height'),   /* as a percentage of the stage */
      hippoSlide:    cssNum('--hippo-slide'),
      purpleCount:   cssNum('--purple-hippo-count'),
      formNudgeUp:   cssNum('--form-nudge-up'),
      tileStagger:   cssNum('--tile-stagger')
    };
  }
  readControls();

  /* =========================
     ELEMENTS + STATE
     ========================= */
  var page=document.getElementById('page'), stage=document.getElementById('stage'),
      hippo=document.getElementById('hippo'), svg=document.getElementById('hippoSvg'),
      trigger=document.getElementById('trigger'), form=document.getElementById('notify'),
      input=document.getElementById('notify-email'), mark=document.getElementById('mark'),
      tiles=document.getElementById('tiles'), thanks=document.getElementById('thanks');

  var mq=window.matchMedia('(max-width: 600px)'),
      reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var hover=false, clicked=false, auto=false, sent=false,
      phase=0, engaged=false, introDone=false, chromeShown=false;
  var cycle=[], idle=null;

  function isOpen(){ return hover||clicked||auto||sent; }

  /* chromeShown / introDone latch on once played, so a replay only re-runs the
     headline — the footer and hippo never blink out mid-loop. */
  function paint(){
    page.className='page p'+phase
      +(phase>=3||chromeShown?' chrome':'')
      +(phase>=4||introDone?' hippo-shown':'')
      +(isOpen()?' open':'')
      +(sent?' sent':'');
    trigger.setAttribute('aria-expanded', String(isOpen()));
    layout();
  }
  function setPhase(p){ phase=p; if(p>=3) chromeShown=true; if(p>=4) introDone=true; paint(); }

  /* =========================
     LAYOUT
     The hippo slides down far enough to open a band above it, and the form is
     centred in that band. Both are measured, never hard-coded, so any screen
     height works.
     ========================= */
  function layout(){
    var m=mq.matches;
    /* mobile crops the back of the hippo and pins the nose to the right edge */
    svg.setAttribute('viewBox', m ? '760 0 1240 754.974' : '0 0 2000 754.974');
    svg.setAttribute('preserveAspectRatio', m ? 'xMaxYMid meet' : 'xMinYMid meet');

    var rigH=T.hippoHeight, pad=m?10:16;
    var stageH=stage.getBoundingClientRect().height,
        formH=form.getBoundingClientRect().height;
    var restTop=stageH*(100-rigH)/200, hippoH=stageH*rigH/100;
    /* the slide only ever grows past its minimum, never shrinks below it */
    var shift=hippoH
      ? Math.min(.95, Math.max(T.hippoSlide, (formH+2*pad-restTop)/hippoH))
      : T.hippoSlide;
    if(stageH){
      var top=((restTop+hippoH*shift)/2 - T.formNudgeUp).toFixed(1)+'px';
      form.style.top=top;
      if(!sent) thanks.style.top=top;
    }
    hippo.style.transform=isOpen() ? 'translateY('+(shift*100).toFixed(0)+'%)' : 'none';
  }

  /* =========================
     INTRO FIELD
     A lattice of hippos the size of the header mark, anchored so the header
     hippo is one of them — it is the only one left standing.
     ========================= */
  /* a small deterministic generator, so the arrangement is stable across
     reloads, resizes and orientation changes */
  function seeded(seed){
    return function(){
      seed|=0; seed=seed+0x6D2B79F5|0;
      var t=Math.imul(seed^seed>>>15,1|seed);
      t=t+Math.imul(t^t>>>7,61|t)^t;
      return ((t^t>>>14)>>>0)/4294967296;
    };
  }

  /* Clearance rules around the centre logo hippo, which is the fixed purple one.
       - nothing in the 7 rows directly below it unless it is 7+ columns away
       - nothing in the columns either side of it unless it is 15+ rows down
     Both are measured in grid steps from the centre.
     A coarse grid (desktop, where each step is a much bigger visual distance)
     cannot honour the full clearance, so the rules relax a level at a time
     until enough of the field is left to place the accents. */
  var CLEARANCE=[
    {belowRows:7, belowCols:7, sideRows:15},   /* as specified — mobile uses this */
    {belowRows:4, belowCols:4, sideRows:8},
    {belowRows:2, belowCols:2, sideRows:4},
    {belowRows:0, belowCols:0, sideRows:0}     /* nothing beyond the centre itself */
  ];
  function clearOfCentre(i,j,rule){
    if(j>0 && j<=rule.belowRows && Math.abs(i)<rule.belowCols) return false;
    if(Math.abs(i)<=1 && j<rule.sideRows) return false;
    return true;
  }

  /* Pick which cells of the field are brand purple.
     One per row, one per column, never touching the centre logo, and spread
     as far apart as the grid allows. */
  function choosePurple(cells){
    var wanted=Math.floor(T.purpleCount);
    if(!(wanted>0)) return {};

    /* the field is built with a ring of tiles beyond the edges so it looks
       continuous — those can never be chosen, or the purple ones land off screen */
    var onScreen=cells.filter(function(c){ return c.onScreen; });
    if(!onScreen.length) return {};

    /* take the strictest clearance that still leaves enough distinct rows and
       columns for the requested number of accents */
    var rule=CLEARANCE[CLEARANCE.length-1], clear=onScreen;
    for(var a=0;a<CLEARANCE.length;a++){
      var test=onScreen.filter(function(c){ return clearOfCentre(c.i,c.j,CLEARANCE[a]); });
      var tr=[], tc=[];
      for(var b=0;b<test.length;b++){
        if(tr.indexOf(test[b].j)<0) tr.push(test[b].j);
        if(tc.indexOf(test[b].i)<0) tc.push(test[b].i);
      }
      if(Math.min(tr.length,tc.length)>=Math.floor(T.purpleCount)){ rule=CLEARANCE[a]; clear=test; break; }
      if(a===0 || Math.min(tr.length,tc.length)>1){ rule=CLEARANCE[a]; clear=test; }
    }
    var inside=clear.length?clear:onScreen;

    var rows=[], cols=[], k;
    for(k=0;k<inside.length;k++){
      if(rows.indexOf(inside[k].j)<0) rows.push(inside[k].j);
      if(cols.indexOf(inside[k].i)<0) cols.push(inside[k].i);
    }
    rows.sort(function(a,b){return a-b;});
    cols.sort(function(a,b){return a-b;});

    /* Drop the rows and columns that touch the centre logo up front, so every
       pairing below is automatically clear of it. Keep them only if removing
       them would leave too little grid to work with. */
    function away(list){ return list.filter(function(v){ return Math.abs(v)>1; }); }
    var rowsFar=away(rows), colsFar=away(cols);
    if(rowsFar.length>=1 && colsFar.length>=1){ rows=rowsFar; cols=colsFar; }

    var n=Math.min(wanted, rows.length, cols.length);
    if(n%2===0) n-=1;              /* always an odd number */
    if(n<1) return {};

    /* evenly spaced rows and columns, so the set spans the whole field */
    function spread(list,count){
      if(count===1) return [list[(list.length-1)>>1]];
      var out=[];
      for(var q=0;q<count;q++) out.push(list[Math.round(q*(list.length-1)/(count-1))]);
      return out;
    }
    var pickRows=spread(rows,n), pickCols=spread(cols,n);

    var free={};
    for(k=0;k<inside.length;k++) free[inside[k].i+','+inside[k].j]=true;

    /* try a number of seeded pairings and keep the one whose hippos sit
       furthest apart — random-looking, never a diagonal. The base seed is drawn
       once per page load, so the arrangement differs each visit but stays put
       through resizes and orientation changes. */
    var best=null, bestScore=-1;
    for(var attempt=0;attempt<240;attempt++){
      var rand=seeded(PURPLE_SEED+attempt);
      var order=pickCols.slice();
      for(var s=order.length-1;s>0;s--){
        var t2=Math.floor(rand()*(s+1)), tmp=order[s]; order[s]=order[t2]; order[t2]=tmp;
      }
      var pts=[];
      for(k=0;k<n;k++){
        var ci=order[k], rj=pickRows[k];
        /* never adjacent to (or on) the centre logo, and it must be a real cell */
        if((Math.abs(ci)<=1&&Math.abs(rj)<=1) || !free[ci+','+rj]) continue;
        if(!clearOfCentre(ci,rj,rule)) continue;
        pts.push([ci,rj]);
      }
      if(!pts.length) continue;
      var minD=Infinity, diagonal=0;
      for(var p=0;p<pts.length;p++){
        for(var q2=p+1;q2<pts.length;q2++){
          minD=Math.min(minD, Math.abs(pts[p][0]-pts[q2][0])+Math.abs(pts[p][1]-pts[q2][1]));
        }
        if(p>0){
          var dx=pts[p][0]-pts[p-1][0], dy=pts[p][1]-pts[p-1][1];
          if(dx!==0 && Math.abs(dx)===Math.abs(dy)) diagonal++;
        }
      }
      if(pts.length===1) minD=99;
      var score=pts.length*10+minD-diagonal*2+(pts.length%2?5:0);
      if(score>bestScore){ bestScore=score; best=pts; }
    }
    if(!best) return {};

    /* a pairing can lose a member to the clearance tests, so enforce the odd
       rule on the result too — drop whichever hippo sits closest to another,
       keeping the remaining set as spread out as possible */
    if(best.length%2===0 && best.length>0){
      var dropAt=0, worst=Infinity;
      for(var p2=0;p2<best.length;p2++){
        var near=Infinity;
        for(var q3=0;q3<best.length;q3++){
          if(q3===p2) continue;
          near=Math.min(near, Math.abs(best[p2][0]-best[q3][0])+Math.abs(best[p2][1]-best[q3][1]));
        }
        if(near<worst){ worst=near; dropAt=p2; }
      }
      best=best.slice(0,dropAt).concat(best.slice(dropAt+1));
    }

    var chosen={};
    for(k=0;k<best.length;k++) chosen[best[k][0]+','+best[k][1]]=true;
    return chosen;
  }

  function buildTiles(){
    var r=mark.getBoundingClientRect();
    if(!r.width) return false;
    var w=r.width, h=r.height, vw=innerWidth, vh=innerHeight;
    var px=w*1.18, py=h*1.98;          /* pitch measured off the brand pattern */
    var c0=r.left+w/2, r0=r.top+h/2, out='', cells=[];

    for(var j=Math.floor(-r0/py)-1;j<=Math.ceil((vh-r0)/py)+1;j++){
      for(var i=Math.floor(-c0/px)-1;i<=Math.ceil((vw-c0)/px)+1;i++){
        if(i===0&&j===0) continue;      /* that one is the header logo */
        var cx=c0+i*px, cy=r0+j*py;
        if(cx<-w||cx>vw+w||cy<-h||cy>vh+h) continue;
        cells.push({
          i:i, j:j, cx:cx, cy:cy,
          onScreen: (cx-w/2>=0 && cx+w/2<=vw && cy-h/2>=0 && cy+h/2<=vh)
        });
      }
    }

    var purple=choosePurple(cells);

    for(var k=0;k<cells.length;k++){
      var c=cells[k];
      var d=Math.hypot((c.cx-c0)/vw,(c.cy-r0)/vh);
      out+='<span class="'+(purple[c.i+','+c.j]?'purple':'')+'" style="left:'+(c.cx-w/2).toFixed(1)
          +'px;top:'+(c.cy-h/2).toFixed(1)
          +'px;width:'+w.toFixed(1)+'px;height:'+h.toFixed(1)
          +'px;transition-delay:'+(d*T.tileStagger).toFixed(2)+'s"></span>';
    }
    tiles.innerHTML=out;
    return true;
  }

  /* =========================
     SEQUENCE
     headline -> hippo -> blink -> "Coming Soon" -> email form,
     replayed on a loop until someone interacts.
     ========================= */
  function runCycle(base){
    cycle=[
      setTimeout(function(){ setPhase(3); }, base),
      setTimeout(function(){ setPhase(4); }, base+T.toHippo),
      setTimeout(blink,                     base+T.toBlink),
      setTimeout(function(){ setPhase(5); }, base+T.toSwap),
      setTimeout(function(){ auto=true; paint(); armIdle(); }, base+T.toForm)
    ];
  }

  /* re-arm the one-shot blink: SVG nodes have no offsetWidth, so reflow on body */
  function blink(){
    var eye=document.querySelector('.eye');
    if(!eye) return;
    eye.classList.remove('blink');
    if(eye.getAnimations) eye.getAnimations().forEach(function(a){ a.cancel(); });
    void document.body.offsetWidth;
    eye.classList.add('blink');
  }

  function clearCycle(){ cycle.forEach(clearTimeout); clearTimeout(idle); }

  function armIdle(){
    clearTimeout(idle);
    if(hover||clicked) return;
    idle=setTimeout(function(){
      if(hover||clicked) return;
      clearCycle(); auto=false; setPhase(2); runCycle(T.loopRestart);
    }, T.idleReset);
  }

  /* any real interest stops the loop for good, so it cannot yank the form away */
  function engage(){ if(engaged) return; engaged=true; clearCycle(); if(phase<5) setPhase(5); }

  function start(){
    if(reduce){ auto=true; setPhase(5); return; }
    if(!buildTiles()){ requestAnimationFrame(start); return; }
    paint();
    setTimeout(function(){
      tiles.querySelectorAll('span').forEach(function(s){ s.style.opacity=0; });
    }, T.fieldClears);
    setTimeout(function(){ setPhase(2); }, T.wordmark);
    runCycle(T.sequenceStart);
  }

  /* =========================
     INTERACTION
     ========================= */
  stage.addEventListener('mouseenter', function(){ engage(); hover=true; paint(); });
  stage.addEventListener('mouseleave', function(){ hover=false; paint(); });
  trigger.addEventListener('click',    function(){ engage(); clicked=!clicked; paint(); });
  trigger.addEventListener('focus',    function(){ engage(); hover=true; paint(); });
  input.addEventListener('focus',      function(){ engage(); hover=true; paint(); });
  input.addEventListener('blur',       function(){ hover=false; paint(); });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    engage();
    var btn=document.getElementById('submit');
    btn.disabled=true; btn.textContent='Sending…';
    /* Apps Script sends no CORS headers, so that post goes out opaque */
    var toSheet=FORM_ENDPOINT.indexOf('script.google.com')>-1;
    var req=toSheet
      ? fetch(FORM_ENDPOINT,{method:'POST',mode:'no-cors',body:new FormData(form)})
      : fetch(FORM_ENDPOINT,{method:'POST',headers:{'Accept':'application/json'},body:new FormData(form)})
          .then(function(r){ if(!r.ok) throw new Error('bad response'); return r; });
    req.then(function(){
        thanks.style.top=form.style.top;
        sent=true;
        form.reset();
        paint();
      })
      .catch(function(){
        btn.disabled=false; btn.textContent='Try again';
      });
  });

  /* =========================
     KEEP IT MEASURED
     ========================= */
  if(window.ResizeObserver){
    var ro=new ResizeObserver(layout);
    ro.observe(stage); ro.observe(form);
  }
  addEventListener('resize', layout);
  addEventListener('orientationchange', function(){ readControls(); layout(); });
  if(mq.addEventListener) mq.addEventListener('change', function(){ readControls(); layout(); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(layout);

  layout();
  start();
})();
</script>
